<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>展览作品｜音频</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#f5f2ea;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px} main{width:min(560px,100%);text-align:center} h1{font-size:clamp(1.7rem,6vw,2.5rem);font-weight:500;letter-spacing:.06em;margin:0 0 12px} p{color:#aaa;margin:0 0 32px} audio{width:100%;height:54px} .note{font-size:.9rem;margin-top:18px;color:#999}
  </style>
</head>
<body>
  <main>
    <h1>展览作品</h1>
    <p>音频播放</p>
    <audio controls preload="metadata">
      <source src="./音频文件.mp3" type="audio/mpeg">
      当前浏览器不支持音频播放，请使用支持 MP3 的浏览器。
    </audio>
    <p class="note">扫码后点击播放即可收听</p>
  </main>
</body>
</html>
